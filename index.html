<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنك أسئلة الفارما</title>
<link rel="stylesheet" href="assets/folks.css">
<link rel="stylesheet" href="assets/app.css">
<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="f">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
  </defs>
</svg>

<div id="app">
  <aside class="rail" id="rail">
    <a class="brand" href="#/">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
      <span><b>بنك أسئلة الفارما</b><small lang="tr">Dönem III · Kan-İmmün-Tümör</small></span>
    </a>
    <label class="search">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="دوّر على درس أو سؤال" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot">
      <span>الشكل</span>
      <div class="f-seg" id="theme" style="--n:3"><span class="f-seg__thumb"></span><button data-t="">تلقائي</button><button data-t="light">فاتح</button><button data-t="dark">غامق</button></div>
    </div>
  </aside>

  <main>
    <header class="top f-glass">
      <button class="f-gbtn f-gbtn--icon menu" id="menu" aria-label="الدروس"><svg class="i"><use href="#i-menu"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <div class="acts" id="acts"></div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>

<script src="data.js"></script>
<script src="extra.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
